version: '3.8'

services:
  # -----------------------------------------------------------
  # 1. Backend Service: FastAPI Data Lineage & FDW Scanner
  # -----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: datalineage_backend
    restart: unless-stopped
    ports:
      - "8003:8000"
    volumes:
      - ./config:/app/config
    environment:
      - CONFIG_FILE=/app/config/databases.json
      - PYTHONUNBUFFERED=1
    extra_hosts:
      # Allows backend container to connect to PostgreSQL running directly on host via 'host.docker.internal'
      - "host.docker.internal:host-gateway"
    security_opt:
      - seccomp:unconfined
    networks:
      - lineage-net

  # -----------------------------------------------------------
  # 2. Frontend Service: React Flow GUI Visualizer
  # -----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: datalineage_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3003:80"
    security_opt:
      - seccomp:unconfined
    networks:
      - lineage-net

networks:
  lineage-net:
    driver: bridge
